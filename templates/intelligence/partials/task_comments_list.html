<!-- Partial Comments List -->
<div id="comments-list-{{ task.id }}" class="space-y-3">
    {% for comment in comments %}
    <div class="bg-slate-950/70 border border-slate-800 rounded-lg p-3 text-xs space-y-1">
        <div class="flex items-center justify-between text-slate-400">
            <span class="font-bold text-slate-200">{{ comment.author_name }}</span>
            <span class="text-[10px] font-mono">{{ comment.created_at|date:"M d, H:i" }}</span>
        </div>
        <p class="text-slate-300 font-sans whitespace-pre-wrap">{{ comment.comment_text }}</p>
    </div>
    {% empty %}
    <p class="text-xs text-slate-500 italic">No comments yet. Leave a progress note below.</p>
    {% endfor %}
</div>
