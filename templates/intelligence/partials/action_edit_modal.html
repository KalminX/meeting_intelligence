<!-- Modal: Edit Action Item Details Before Approval -->
<div class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-xl w-full flex flex-col shadow-2xl overflow-hidden">
        <div class="p-5 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <i data-lucide="edit-3" class="w-5 h-5 text-indigo-400"></i>
                <h3 class="text-base font-bold text-white">Edit & Modify Action Item</h3>
            </div>
            <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="text-slate-400 hover:text-white">
                <i data-lucide="x" class="w-5 h-5"></i>
            </button>
        </div>

        <form method="post" action="{% url 'intelligence:action_edit' action.id %}" hx-post="{% url 'intelligence:action_edit' action.id %}" hx-target="#modal-container" class="p-6 space-y-4">
            {% csrf_token %}

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Action Title</label>
                {{ form.title }}
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Description / Deliverable</label>
                {{ form.description }}
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Proposed Owner</label>
                    {{ form.proposed_owner_name }}
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Owner Email</label>
                    {{ form.proposed_owner_email }}
                </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Due Date</label>
                    {{ form.proposed_due_date }}
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Urgency</label>
                    {{ form.urgency }}
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-300 uppercase mb-1">Target Project</label>
                    {{ form.suggested_project_name }}
                </div>
            </div>

            <!-- Evidence Quote preview -->
            <div class="bg-slate-950 p-3 rounded-lg border border-slate-800 text-xs">
                <span class="text-slate-400 font-semibold block text-[11px] mb-1">Transcript Evidence Quote:</span>
                <p class="text-slate-300 font-mono italic">{{ action.transcript_quote }}</p>
            </div>

            <div class="pt-4 border-t border-slate-800 flex justify-end space-x-3">
                <button type="button" onclick="document.getElementById('modal-container').innerHTML=''" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-xs font-semibold transition">
                    Cancel
                </button>
                <button type="submit" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition shadow-md shadow-indigo-600/30 flex items-center">
                    <i data-lucide="check" class="w-3.5 h-3.5 mr-1.5"></i>
                    Save Modifications & Approve
                </button>
            </div>
        </form>
    </div>
</div>
