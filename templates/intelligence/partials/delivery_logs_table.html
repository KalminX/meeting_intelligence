<!-- Partial: Email Delivery Logs Table -->
<div class="space-y-3">
    {% for log in delivery_logs %}
    <div class="bg-slate-950/70 border border-slate-800 rounded-lg p-3.5 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2">
        <div class="space-y-1">
            <div class="flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
                <span class="font-bold text-white">{{ log.subject }}</span>
            </div>
            <p class="text-slate-400">Recipients: <span class="text-indigo-300 font-mono">{{ log.recipient_emails }}</span></p>
            <p class="text-[11px] text-slate-500 font-mono">SMTP Response: {{ log.smtp_response }}</p>
        </div>
        <div class="text-right flex-shrink-0 text-slate-400 font-mono text-[11px]">
            {{ log.sent_at|date:"M d, Y @ H:i:s" }}
        </div>
    </div>
    {% empty %}
    <p class="text-xs text-slate-500 text-center py-4">No report delivery records yet.</p>
    {% endfor %}
</div>
